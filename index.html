<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a365d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Grupo Montenegro">
    <link rel="apple-touch-icon" href="images/logo-holding.png">
    <link rel="manifest" href="manifest.json">
    <title>Grupo Montenegro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a365d 0%, #2d4a7c 50%, #1a365d 100%);
            height: 100vh;          /* navegadores antiguos */
            height: 100dvh;         /* alto real visible (sin barras del navegador) */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* abajo: espacio para el botón redondo de inicio */
            padding: calc(10px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom));
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .header img {
            width: clamp(56px, 10dvh, 90px);
            height: clamp(56px, 10dvh, 90px);
            object-fit: contain;
            border-radius: 20px;
            background: white;
            padding: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .header h1 {
            color: #c9a227;
            font-size: 1.15rem;
            margin-top: 6px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            /* 5 filas que se reparten el alto disponible: todo entra en una pantalla */
            grid-auto-rows: minmax(0, 1fr);
            gap: 10px;
            max-width: 400px;
            width: 100%;
            flex: 1 1 0;
            min-height: 0;
            max-height: 640px;
        }

        /* La última tarjeta, si queda sola en su fila, va centrada */
        .grid .card:last-child:nth-child(odd) {
            grid-column: 1 / -1;
            justify-self: center;
            width: calc(50% - 5px);
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            text-decoration: none;
            min-height: 0;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card:active {
            transform: scale(0.95);
        }

        .card img {
            width: auto;
            height: clamp(30px, 6.5dvh, 64px);
            max-width: 80%;
            object-fit: contain;
            margin-bottom: 4px;
        }

        .card span {
            color: #1a365d;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
        }

        .home-button {
            position: fixed;
            bottom: calc(12px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: white;
            border: 4px solid #c9a227;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .home-button:hover {
            transform: translateX(-50%) scale(1.1);
        }

        .home-button:active {
            transform: translateX(-50%) scale(0.95);
        }

        .home-button img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        /* Efecto de carga */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a365d;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading img {
            width: 120px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <!-- Pantalla de carga -->
    <div class="loading" id="loading">
        <img src="images/logo-holding.png" alt="Cargando...">
    </div>

    <!-- Header -->
    <div class="header">
        <img src="images/logo-holding.png" alt="Grupo Montenegro">
        <h1>GRUPO MONTENEGRO</h1>
    </div>

    <!-- Grid de aplicaciones -->
    <div class="grid">
        <a href="https://comercialliliana.organizatic.com/principal#/" class="card" target="_blank" rel="noopener">
            <img src="images/logo-liliana.png" alt="Comercial Liliana">
            <span>Comercial Liliana</span>
        </a>

        <a href="https://comercialodoncito.organizatic.com/principal#/" class="card" target="_blank" rel="noopener">
            <img src="images/logo-odoncito.png" alt="Comercial Odoncito">
            <span>Comercial Odoncito</span>
        </a>

        <a href="https://cheplast.organizatic.com" class="card" target="_blank" rel="noopener">
            <img src="images/logo-cheplas.png" alt="Che Plast">
            <span>Che Plast</span>
        </a>

        <a href="https://programa-caja.web.app" class="card" target="_blank" rel="noopener">
            <img src="images/logo-programa-caja.png" alt="Programa Caja">
            <span>Programa Caja</span>
        </a>

        <a href="http://192.168.1.240:8091" class="card" target="_blank" rel="noopener">
            <img src="images/logo-etiquetas.png" alt="Etiquetas">
            <span>Etiquetas</span>
        </a>

        <a href="https://ahhm0699.github.io/habitaciones/" class="card" target="_blank" rel="noopener">
            <img src="images/logo-habitaciones.png" alt="Habitaciones">
            <span>Habitaciones</span>
        </a>

        <a href="http://192.168.1.17:3000" class="card" target="_blank" rel="noopener">
            <img src="images/logo-entregas.png" alt="Entregas">
            <span>Entregas</span>
        </a>

        <a href="https://separaciones.huidobroabdon.workers.dev" class="card" target="_blank" rel="noopener">
            <img src="images/logo-separaciones.png" alt="Separaciones">
            <span>Separaciones</span>
        </a>

        <a href="http://192.168.1.240:8095/admin" class="card" target="_blank" rel="noopener">
            <img src="images/logo-asistencia.png" alt="Asistencia">
            <span>Asistencia</span>
        </a>
    </div>

    <!-- Boton de inicio -->
    <button class="home-button" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <img src="images/logo-holding.png" alt="Inicio">
    </button>

    <script>
        // Ocultar pantalla de carga
        // (antes esperaba a que bajaran todas las imágenes; ahora se va apenas
        //  la página está lista, y como máximo al segundo)
        function ocultarCarga() { document.getElementById('loading').classList.add('hidden'); }
        document.addEventListener('DOMContentLoaded', function() { setTimeout(ocultarCarga, 250); });
        setTimeout(ocultarCarga, 1000);

        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            // Recargar una vez cuando entra una version nueva del menu
            var teniaControlador = !!navigator.serviceWorker.controller;
            var recargando = false;
            navigator.serviceWorker.addEventListener('controllerchange', function() {
                if (!teniaControlador || recargando) return;
                recargando = true;
                window.location.reload();
            });

            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .then(function(registration) {
                    console.log('Service Worker registrado:', registration);
                })
                .catch(function(error) {
                    console.log('Error al registrar Service Worker:', error);
                });
        }
    </script>
</body>
</html>
